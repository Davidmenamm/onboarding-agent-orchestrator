# Load balancer: Docker DNS returns every api replica; nginx round-robins between them.
upstream api {
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=start:10m rate=10r/m;

server {
    listen 80;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /api/v1/onboarding/start {
        limit_req zone=start burst=5 nodelay;
        proxy_pass http://api;
        include /etc/nginx/proxy.conf;
    }

    # Server-sent events: no buffering, long timeout.
    location ~ ^/api/v1/onboarding/[^/]+/events$ {
        proxy_pass http://api;
        include /etc/nginx/proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location ~ ^/(api|\.well-known|healthz|readyz|docs|openapi.json) {
        proxy_pass http://api;
        include /etc/nginx/proxy.conf;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
